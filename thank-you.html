<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You | ROAA Construction and Finishing</title>
    <meta name="description" content="Thank you. Your message has reached ROAA Construction and Finishing." />
    <meta name="theme-color" content="#76b142" />
    <script>
      try {
        var saved = localStorage.getItem("roaa-theme");
        var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="page page--thanks">
    <a class="skip-link" href="#content">Skip to content</a>
    <a class="thanks__logo" href="index.html">
      <img class="logo--light" src="assets/lightmode-logo.png" alt="ROAA Construction and Finishing" />
      <img class="logo--dark" src="assets/darkmode-logo.png" alt="ROAA Construction and Finishing" />
    </a>
    <button class="theme-toggle thanks__theme" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.8"/></svg>
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 3.2A8.5 8.5 0 1 0 20.8 14 7 7 0 0 1 16 3.2Z" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <main class="thanks" id="content">
      <article class="thanks__card">
        <span class="thanks__mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="22" fill="#76b142" opacity="0.16" />
            <path d="M20 42 V28 H28 V42 M28 42 V22 H40 V42 M40 42 V30 H48 V42" stroke="currentColor" stroke-width="1.8" />
            <path d="M16 44 H50" stroke="#ffca04" stroke-width="2.2" />
          </svg>
        </span>
        <h1>Thank you</h1>
        <p>Your message has reached ROAA Construction and Finishing. We will review it and respond shortly.</p>
        <a class="btn" href="index.html">Back to the site</a>
        <a class="thanks__again" href="contact.html">Send another message</a>
        <p class="thanks__slogan">You Dream It, We Build It</p>
      </article>
    </main>
    <script src="assets/js/site.js"></script>
  </body>
</html>
